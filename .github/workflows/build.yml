name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Write source files
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset

          cat > VoiceChangerApp.swift << 'ENIFILE'
          import SwiftUI

          @main
          struct VoiceChangerApp: App {
              @StateObject private var audio = AudioEngineManager()
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .environmentObject(audio)
                          .preferredColorScheme(.dark)
                          .onAppear { audio.prepare() }
                  }
              }
          }
          ENIFILE

          cat > AudioEngineManager.swift << 'ENIFILE'
          import Foundation
          import AVFoundation
          import Combine

          final class AudioEngineManager: ObservableObject {
              @Published var isRunning: Bool = false
              @Published var pitchSemitones: Float = 0.0
              @Published var hasPermission: Bool = false
              @Published var lastError: String?
              @Published var lastStep: String = "boot"

              private var engine: AVAudioEngine?
              private var pitchUnit: AVAudioUnitTimePitch?
              private let session = AVAudioSession.sharedInstance()
              private let stateKey = "vc_running"
              private let pitchKey = "vc_pitch"
              private let stepKey = "vc_step"

              init() {
                  if UserDefaults.standard.object(forKey: pitchKey) == nil {
                      pitchSemitones = 5.0
                      UserDefaults.standard.set(5.0, forKey: pitchKey)
                  } else {
                      pitchSemitones = UserDefaults.standard.float(forKey: pitchKey)
                  }
                  if let prev = UserDefaults.standard.string(forKey: stepKey) {
                      lastStep = "prev: " + prev
                  }
                  NotificationCenter.default.addObserver(self, selector: #selector(onInterruption(_:)), name: AVAudioSession.interruptionNotification, object: nil)
                  NotificationCenter.default.addObserver(self, selector: #selector(onRouteChange(_:)), name: AVAudioSession.routeChangeNotification, object: nil)
              }

              private func mark(_ s: String) {
                  lastStep = s
                  UserDefaults.standard.set(s, forKey: stepKey)
                  UserDefaults.standard.synchronize()
              }

              private func errText(_ e: Error) -> String {
                  let ns = e as NSError
                  return "\(ns.domain)#\(ns.code): \(ns.localizedDescription)"
              }

              func prepare() {
                  mark("P1 requestPerm")
                  requestPermission { [weak self] granted in
                      DispatchQueue.main.async {
                          guard let self else { return }
                          self.hasPermission = granted
                          self.mark("P2 granted=\(granted)")
                      }
                  }
              }

              func toggle() { if isRunning { stop() } else { start() } }

              func start() {
                  mark("A enter")
                  guard hasPermission else {
                      mark("B noPerm")
                      requestPermission { [weak self] g in
                          guard let self, g else { return }
                          DispatchQueue.main.async { self.hasPermission = true; self.start() }
                      }
                      return
                  }
                  mark("C permOK")
                  stopInternal()

                  do {
                      mark("E setCategory")
                      try session.setCategory(.playAndRecord, mode: .default, options: [.defaultToSpeaker])
                      mark("F setActive")
                      try session.setActive(true)
                      mark("G active")

                      let eng = AVAudioEngine()
                      let unit = AVAudioUnitTimePitch()
                      unit.pitch = max(-2400, min(2400, pitchSemitones * 100))
                      unit.overlap = 8.0
                      unit.rate = 1.0
                      mark("H unit cfg pitch=\(Int(unit.pitch))")

                      let input = eng.inputNode
                      let fmt = input.inputFormat(forBus: 0)
                      mark("J fmt \(Int(fmt.sampleRate))Hz \(fmt.channelCount)ch")

                      guard fmt.sampleRate > 0, fmt.channelCount > 0 else {
                          throw NSError(domain: "VC", code: 1, userInfo: [NSLocalizedDescriptionKey: "mic format 0Hz or 0ch"])
                      }

                      eng.attach(unit)
                      mark("K attach")
                      eng.connect(input, to: unit, format: fmt)
                      mark("L conn1")
                      eng.connect(unit, to: eng.mainMixerNode, format: nil)
                      eng.mainMixerNode.outputVolume = 1.0
                      mark("M conn2 vol=1.0")

                      eng.prepare()
                      try eng.start()
                      mark("O started pitch=\(Int(unit.pitch))")

                      self.engine = eng
                      self.pitchUnit = unit
                      self.isRunning = true
                      self.lastError = nil
                      UserDefaults.standard.set(true, forKey: self.stateKey)
                  } catch {
                      let msg = errText(error)
                      mark("ERR \(msg)")
                      self.lastError = msg
                      self.isRunning = false
                      self.stopInternal()
                      try? session.setActive(false, options: .notifyOthersOnDeactivation)
                  }
              }

              func stop() {
                  stopInternal()
                  try? session.setActive(false, options: .notifyOthersOnDeactivation)
                  isRunning = false
                  UserDefaults.standard.set(false, forKey: stateKey)
                  mark("stopped")
              }

              private func stopInternal() {
                  engine?.stop()
                  engine = nil
                  pitchUnit = nil
              }

              func setPitch(semitones: Float) {
                  pitchSemitones = semitones
                  pitchUnit?.pitch = max(-2400, min(2400, semitones * 100))
                  UserDefaults.standard.set(semitones, forKey: pitchKey)
                  mark("pitch=\(Int(semitones * 100))c")
              }

              func nudgePitch(by delta: Float) { setPitch(semitones: pitchSemitones + delta) }

              private func requestPermission(completion: @escaping (Bool) -> Void) {
                  if #available(iOS 17.0, *) {
                      AVAudioApplication.requestRecordPermission { completion($0) }
                  } else {
                      session.requestRecordPermission { completion($0) }
                  }
              }

              @objc private func onInterruption(_ note: Notification) {
                  guard let info = note.userInfo,
                        let raw = info[AVAudioSessionInterruptionTypeKey] as? UInt,
                        let type = AVAudioSession.InterruptionType(rawValue: raw) else { return }
                  switch type {
                  case .began: DispatchQueue.main.async { self.isRunning = false; self.stopInternal() }
                  case .ended:
                      guard let oRaw = info[AVAudioSessionInterruptionOptionKey] as? UInt else { return }
                      if AVAudioSession.InterruptionOptions(rawValue: oRaw).contains(.shouldResume) {
                          DispatchQueue.main.async { self.start() }
                      }
                  @unknown default: break
                  }
              }

              @objc private func onRouteChange(_ note: Notification) {
                  guard let info = note.userInfo,
                        let raw = info[AVAudioSessionRouteChangeReasonKey] as? UInt,
                        let reason = AVAudioSession.RouteChangeReason(rawValue: raw) else { return }
                  switch reason {
                  case .oldDeviceUnavailable: if isRunning { DispatchQueue.main.async { self.start() } }
                  case .newDeviceAvailable: if isRunning { DispatchQueue.main.async { self.start() } }
                  default: break
                  }
              }
          }
          ENIFILE

          cat > PitchSliderView.swift << 'ENIFILE'
          import SwiftUI

          struct PitchSliderView: View {
              @EnvironmentObject var audio: AudioEngineManager
              private let step: Float = 0.20
              private let range: ClosedRange<Float> = -12.0...12.0

              var body: some View {
                  HStack(spacing: 14) {
                      stepButton(symbol: "plus", tint: Color(red: 0.25, green: 0.55, blue: 1.0)) { audio.nudgePitch(by: step) }
                      ZStack {
                          Capsule().fill(Color.white.opacity(0.06)).frame(height: 6)
                          GeometryReader { geo in
                              let pct = normalized(pitch: audio.pitchSemitones)
                              Capsule()
                                  .fill(LinearGradient(colors: [Color(red: 0.20, green: 0.45, blue: 1.0), Color(red: 0.35, green: 0.65, blue: 1.0)], startPoint: .leading, endPoint: .trailing))
                                  .frame(width: max(0, geo.size.width * pct), height: 6)
                          }.frame(height: 6)
                          Slider(value: Binding(get: { audio.pitchSemitones }, set: { v in
                              let s = (v / step).rounded() * step
                              audio.setPitch(semitones: s)
                          }), in: range).tint(.clear).opacity(0.02)
                          Text(String(format: "%+.2f", audio.pitchSemitones))
                              .font(.system(size: 15, weight: .semibold, design: .rounded))
                              .foregroundStyle(.white)
                              .padding(.horizontal, 10).padding(.vertical, 4)
                              .background(Capsule().fill(Color.black.opacity(0.55)))
                              .overlay(Capsule().stroke(Color.white.opacity(0.08), lineWidth: 0.5))
                              .allowsHitTesting(false)
                      }
                      stepButton(symbol: "minus", tint: Color(red: 0.95, green: 0.30, blue: 0.35)) { audio.nudgePitch(by: -step) }
                  }
              }

              private func normalized(pitch: Float) -> CGFloat {
                  let c = max(range.lowerBound, min(range.upperBound, pitch))
                  return CGFloat((c - range.lowerBound) / (range.upperBound - range.lowerBound))
              }

              private func stepButton(symbol: String, tint: Color, action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      Image(systemName: symbol)
                          .font(.system(size: 16, weight: .bold))
                          .foregroundStyle(.white)
                          .frame(width: 44, height: 44)
                          .background(Circle().fill(LinearGradient(colors: [tint.opacity(0.9), tint.opacity(0.6)], startPoint: .top, endPoint: .bottom)).shadow(color: tint.opacity(0.4), radius: 8, y: 4))
                  }.buttonStyle(.plain)
              }
          }
          ENIFILE

          cat > ContentView.swift << 'ENIFILE'
          import SwiftUI

          struct ContentView: View {
              @EnvironmentObject var audio: AudioEngineManager
              @State private var press: Bool = false

              var body: some View {
                  ZStack {
                      Color(red: 0.03, green: 0.03, blue: 0.05).ignoresSafeArea()
                      RadialGradient(colors: [Color(red: 0.10, green: 0.18, blue: 0.45).opacity(0.55), .clear], center: .top, startRadius: 10, endRadius: 520).ignoresSafeArea()
                      RadialGradient(colors: [Color(red: 0.45, green: 0.06, blue: 0.12).opacity(0.35), .clear], center: .bottom, startRadius: 10, endRadius: 460).ignoresSafeArea()

                      VStack(spacing: 0) {
                          VStack(spacing: 6) {
                              Text("VOICE CHANGER").font(.system(size: 26, weight: .heavy, design: .rounded)).tracking(4.0).foregroundStyle(LinearGradient(colors: [.white, .white.opacity(0.65)], startPoint: .top, endPoint: .bottom))
                              Text("real-time pitch - local monitoring").font(.system(size: 11, weight: .medium, design: .rounded)).foregroundStyle(.white.opacity(0.35))
                          }.padding(.top, 12)

                          Spacer()

                          Button(action: {
                              withAnimation(.spring(response: 0.35, dampingFraction: 0.75)) { press = true }
                              audio.toggle()
                              DispatchQueue.main.asyncAfter(deadline: .now() + 0.12) {
                                  withAnimation(.spring(response: 0.35, dampingFraction: 0.75)) { press = false }
                              }
                          }) {
                              ZStack {
                                  Circle().fill(glow.opacity(audio.isRunning ? 0.42 : 0.20)).frame(width: 240, height: 240).blur(radius: 34)
                                  Circle()
                                      .fill(RadialGradient(colors: [main.opacity(0.95), main.opacity(0.62)], center: .topLeading, startRadius: 4, endRadius: 150))
                                      .frame(width: 200, height: 200)
                                      .overlay(Circle().stroke(Color.white.opacity(0.16), lineWidth: 1))
                                      .overlay(Circle().stroke(main.opacity(0.65), lineWidth: 2).blur(radius: 0.8))
                                      .shadow(color: main.opacity(0.55), radius: 26, y: 12)
                                  VStack(spacing: 6) {
                                      Image(systemName: audio.isRunning ? "power.circle.fill" : "power.circle").font(.system(size: 30, weight: .semibold)).foregroundStyle(.white.opacity(0.92))
                                      Text(audio.isRunning ? "ჩართულია" : "გამორთულია").font(.system(size: 20, weight: .bold, design: .rounded)).foregroundStyle(.white)
                                  }
                              }.scaleEffect(press ? 0.94 : 1.0)
                          }.buttonStyle(.plain)

                          Spacer()

                          VStack(alignment: .leading, spacing: 14) {
                              HStack {
                                  Text("PITCH").font(.system(size: 11, weight: .bold, design: .rounded)).foregroundStyle(.white.opacity(0.45)).tracking(1.6)
                                  Spacer()
                                  Text(String(format: "%+.2f st", audio.pitchSemitones)).font(.system(size: 13, weight: .semibold, design: .monospaced)).foregroundStyle(Color(red: 0.45, green: 0.70, blue: 1.0))
                              }
                              PitchSliderView().environmentObject(audio)
                              Text("Right = higher, Left = deeper.").font(.system(size: 10, weight: .regular, design: .rounded)).foregroundStyle(.white.opacity(0.30))
                          }
                          .padding(18)
                          .background(RoundedRectangle(cornerRadius: 20, style: .continuous).fill(Color.white.opacity(0.035)).overlay(RoundedRectangle(cornerRadius: 20, style: .continuous).stroke(Color.white.opacity(0.07), lineWidth: 0.6)))
                          .padding(.bottom, 8)

                          VStack(alignment: .leading, spacing: 4) {
                              HStack(spacing: 6) {
                                  Circle().fill(audio.isRunning ? Color.green : Color.red).frame(width: 7, height: 7)
                                  Text(audio.isRunning ? "ACTIVE" : "INACTIVE").font(.system(size: 10, weight: .bold, design: .rounded)).foregroundStyle(.white.opacity(0.55)).tracking(1.4)
                                  Spacer()
                                  Text("iOS \(UIDevice.current.systemVersion)").font(.system(size: 10)).foregroundStyle(.white.opacity(0.30))
                              }
                              Text("step: \(audio.lastStep)")
                                  .font(.system(size: 10, weight: .regular, design: .monospaced))
                                  .foregroundStyle(.white.opacity(0.55))
                                  .lineLimit(2)
                                  .frame(maxWidth: .infinity, alignment: .leading)
                              if let e = audio.lastError {
                                  Text("err: \(e)")
                                      .font(.system(size: 10, weight: .regular, design: .monospaced))
                                      .foregroundStyle(Color.red.opacity(0.85))
                                      .lineLimit(3)
                                      .frame(maxWidth: .infinity, alignment: .leading)
                              }
                          }.padding(.top, 8)
                      }
                      .padding(.horizontal, 28).padding(.vertical, 32)
                  }
              }

              private var main: Color { audio.isRunning ? Color(red: 0.15, green: 0.78, blue: 0.35) : Color(red: 0.92, green: 0.22, blue: 0.28) }
              private var glow: Color { audio.isRunning ? .green : .red }
          }
          ENIFILE

          printf '%s' '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          printf '%s' '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Generate icon
        run: |
          python3 << 'PYEOF'
          import struct, zlib, math
          size = 1024
          def chunk(t, d):
              c = t + d
              return struct.pack(">I", len(d)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)
          ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
          rows = []
          c = size / 2
          for y in range(size):
              row = b"\x00"
              for x in range(size):
                  t = (x + y) / (2 * size)
                  r = int(15 + 60 * t)
                  g = int(20 + 50 * t)
                  b = int(60 + 130 * t)
                  dx, dy = x - c, y - c
                  d = math.hypot(dx, dy)
                  if abs(d - 320) < 55 or d < 110:
                      r, g, b = 240, 245, 250
                  row += bytes([r, g, b, 255])
              rows.append(row)
          idat = zlib.compress(b"".join(rows))
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", idat) + chunk(b"IEND", b"")
          open("Assets.xcassets/AppIcon.appiconset/icon.png", "wb").write(png)
          print("Icon written")
          PYEOF

      - name: Write project.yml
        run: |
          cat > project.yml << 'ENIFILE'
          name: VoiceChanger
          options:
            bundleIdPrefix: com.lo
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true
          targets:
            VoiceChanger:
              type: application
              platform: iOS
              sources:
                - VoiceChangerApp.swift
                - ContentView.swift
                - AudioEngineManager.swift
                - PitchSliderView.swift
                - Assets.xcassets
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Voice Changer
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  NSMicrophoneUsageDescription: Voice Changer needs microphone access to process your voice.
                  UILaunchScreen: {}
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  UIUserInterfaceStyle: Dark
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.lo.voicechanger
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  TARGETED_DEVICE_FAMILY: 1
                  SWIFT_VERSION: 5.0
          ENIFILE

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project VoiceChanger.xcodeproj \
            -target VoiceChanger \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build" \
            OBJROOT="$(pwd)/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ./build/Release-iphoneos/VoiceChanger.app Payload/
          zip -qry VoiceChanger.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-IPA
          path: VoiceChanger.ipa
